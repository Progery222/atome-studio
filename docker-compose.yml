version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - PH_API_KEY=${PH_API_KEY}
      - PH_PROJECT_ID=${PH_PROJECT_ID}
      - POSTMAN_API_KEY=${POSTMAN_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_URL=${MINIO_URL:-http://minio:9000}
      - MINIO_BUCKET=${MINIO_BUCKET:-atome-videos}
      - SPORTZAVOD_URL=${SPORTZAVOD_URL:-http://sportzavod:8000}
      - CONTENTZAVOD_URL=${CONTENTZAVOD_URL:-http://contentzavod:8002}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://orchestrator:8001}
      - STREAMCUT_URL=${STREAMCUT_URL:-http://host.docker.internal:8003}
      - STREAMCUT_SERVICE_PASSWORD=${STREAMCUT_SERVICE_PASSWORD:-atome-service-pw}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - API_INTERNAL_URL=http://api:3001
    depends_on:
      - api
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Создаёт бакет atome-videos и ставит публичную политику (list + read)
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/atome-videos &&
        mc anonymous set download local/atome-videos &&
        echo 'MinIO bucket atome-videos ready'
      "
    restart: "no"

volumes:
  minio_data:
