server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Force nginx to re-resolve DNS on every request (critical for Railway redeploys)
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    # Proxy API requests to NestJS (Railway internal network)
    location /api/ {
        proxy_pass $API_INTERNAL_URL/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (Socket.io handshake goes to /socket.io/...)
    location /socket.io/ {
        proxy_pass $API_INTERNAL_URL;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA routing — all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
