server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver is injected from /etc/resolv.conf at container startup (see Dockerfile CMD)
    # This makes nginx re-resolve .railway.internal hostnames on each request
    resolver $RESOLVER valid=10s ipv6=off;

    # Proxy API requests to NestJS (Railway internal network)
    # set + variable in proxy_pass forces nginx to re-resolve DNS on each request
    location /api/ {
        set $api_upstream ${API_INTERNAL_URL};
        proxy_pass $api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (Socket.io handshake goes to /socket.io/...)
    location /socket.io/ {
        set $api_upstream ${API_INTERNAL_URL};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Prevent nginx from killing idle WebSocket connections (default is 60s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA routing — all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
