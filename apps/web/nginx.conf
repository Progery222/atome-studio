server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver is injected from /etc/resolv.conf at container startup (see Dockerfile CMD)
    # Railway DNS is at fd12::10 (IPv6) — no ipv6=off so the resolver itself is usable
    resolver $RESOLVER valid=10s;

    # Proxy API requests to NestJS (Railway internal network)
    # With variables in proxy_pass nginx does NOT strip the location prefix,
    # so proxy_pass $upstream (no path suffix) correctly forwards /api/... as-is
    location /api/ {
        set $api_upstream ${API_INTERNAL_URL};
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # Proxy WebSocket (Socket.io handshake goes to /socket.io/...)
    location /socket.io/ {
        set $api_upstream ${API_INTERNAL_URL};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Prevent nginx from killing idle WebSocket connections (default is 60s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Native farm WebSocket proxy. atome-api validates the httpOnly JWT cookie
    # and then tunnels to atome-farm /ws/events over WireGuard.
    location /ws/farm/events {
        set $api_upstream ${API_INTERNAL_URL};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /ws/chat {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 410 '{"error_code":"legacy_chat_disabled_for_mvp","message":"Legacy chat is disabled for MVP","details":{"replacement":"/ws/farm/events"}}';
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /index.html =404;
    }

    # SPA routing — all unknown paths → index.html.
    # HTML must not be cached or browsers can keep loading an old index-*.js.
    location / {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
