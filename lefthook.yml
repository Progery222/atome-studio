pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx @biomejs/biome check --no-errors-on-unmatched --diagnostic-level=error {staged_files}
    tsc:
      root: "apps/web"
      run: npx tsc --noEmit

commit-msg:
  commands:
    conventional-commit:
      run: cz check --commit-msg-file {1}
