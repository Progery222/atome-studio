name: Deploy StreamCut

on:
  push:
    branches: [main]
    paths:
      - "apps/StreamCut/**"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@3

      - name: Deploy StreamCut Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service ${{ vars.STREAMCUT_BACKEND_SERVICE_ID }} \
            --environment production \
            --detach

  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@3

      - name: Deploy StreamCut Worker to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service ${{ vars.STREAMCUT_WORKER_SERVICE_ID }} \
            --environment production \
            --detach
